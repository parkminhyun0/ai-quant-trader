name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp src/ai_quant_trader/web/static/index.html _site/index.html
          cp src/ai_quant_trader/web/static/app.js _site/app.js
          cp src/ai_quant_trader/web/static/styles.css _site/styles.css
          sed -i 's#href="/static/styles.css"#href="./styles.css"#' _site/index.html
          sed -i 's#src="/static/app.js"#src="./app.js"#' _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
